# Current version assumption: clang-15/16/17.

# The following suppressions share one rationale.  In each case TSAN reports a data race where *both* racing
# accesses are inside jemalloc's own code, operating on jemalloc-internal state; our code appears only up-stack,
# reaching that state through jemalloc's API like any allocator user.  jemalloc is thread-safe by contract, but
# it achieves this with its own synchronization schemes -- including deliberate unlocked/relaxed accesses that are
# formally data races; TSAN flags those, as it cannot certify such schemes.  The observed cases:
#   - Extent-management guts (extent_*(), edata_*()) within the subtree of a `je_arena*()` call.
#   - The stats machinery -- mallctl() a/k/a je_mallctl*(): ctl_refresh() and friends read counters that
#     allocator paths update concurrently.  jemalloc stats are documented as approximate; unsynchronized reads
#     are how that approximation is implemented.
#   - Thread-cache flush (je_tcache_bin_flush_*()): an intentionally-unlocked optimistic read of bin/extent
#     metadata (tcache_bin_flush_impl()) versus updates made under the bin lock.
# Note that a suppression hides any report wherein *any* frame of either stack matches; so, e.g., a genuine race
# between our code and someone's mallctl() call would be hidden too.  This is acceptable: we touch
# jemalloc-internal memory only via jemalloc's API, so a report matching these prefixes is, in practice,
# jemalloc-versus-jemalloc.
#
# Tangential notes:
#   - jemalloc is certainly not alone in using "deliberate unlocked/relaxed [concurrent] accesses"; for example
#     boost.interprocess SHM-related internals do it in places.
#   - However in Flow and Flow-IPC proper we endeavour to not use such schemes.  If unlocked concurrent access
#     is necessary, then we use atomic<>, with the most-relaxed appropriate memory ordering.  So if TSAN were
#     to find something conceptually similar, that is formally a bug and should be fixed as opposed to
#     TSAN-suppressed (even if for all architectures in practice it's "fine" to suppress).
race:^je_arena
race:^je_mallctl
race:^je_tcache_bin_flush
